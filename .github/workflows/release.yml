name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: Run quality gates
        run: |
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 test --workspace --locked
          cargo +1.90.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.90.0 run --quiet -p kil -- schema > /tmp/kil-v2.schema.json
          cargo +1.90.0 run --quiet -p kil -- schema --module > /tmp/kil-module-v2.schema.json
          python3 -c 'import json; assert json.load(open("schemas/kil-v2.schema.json")) == json.load(open("/tmp/kil-v2.schema.json"))'
          python3 -c 'import json; assert json.load(open("schemas/kil-module-v2.schema.json")) == json.load(open("/tmp/kil-module-v2.schema.json"))'

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: kil.exe
            archive: kil-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: kil
            archive: kil-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: kil
            archive: kil-x86_64-apple-darwin.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            executable: kil
            archive: kil-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust 1.90
        shell: pwsh
        run: rustup toolchain install 1.90.0 --profile minimal --target ${{ matrix.target }}

      - name: Build release binary
        shell: pwsh
        run: cargo +1.90.0 build --locked --release --target ${{ matrix.target }} -p kil

      - name: Download bundled KiCadRoutingTools
        shell: pwsh
        run: |
          $krtVersion = (Get-Content KRT_VERSION -Raw).Trim()
          git clone --depth 1 --branch $krtVersion https://github.com/drandyhaas/KiCadRoutingTools.git krt-source
          python -m pip install --disable-pip-version-check --quiet numpy
          python krt-source/build_router.py --tag $krtVersion

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path payload/krt/rust_router -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "payload/${{ matrix.executable }}"
          Copy-Item krt-source/py_router payload/krt/py_router -Recurse
          Copy-Item krt-source/rust_router/Cargo.toml payload/krt/rust_router/Cargo.toml
          Copy-Item krt-source/LICENSE payload/krt/LICENSE
          Copy-Item krt-source/VERSION payload/krt/VERSION
          Copy-Item krt-source/requirements.txt payload/krt/requirements.txt
          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item krt-source/rust_router/grid_router.pyd payload/krt/rust_router/grid_router.pyd
          } else {
            Copy-Item krt-source/rust_router/grid_router.so payload/krt/rust_router/grid_router.so
          }
          if ("${{ matrix.archive }}".EndsWith(".zip")) {
            Compress-Archive -Path "payload/*" -DestinationPath "${{ matrix.archive }}"
          } else {
            tar -czf "${{ matrix.archive }}" -C payload .
          }

      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          & (Resolve-Path "payload/${{ matrix.executable }}") --version
          if ($LASTEXITCODE -ne 0) { throw "packaged kil binary failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum kil-* > SHA256SUMS

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
